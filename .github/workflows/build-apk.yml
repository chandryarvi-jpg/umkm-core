name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Jenis build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Ekstrak project.zip (kalau ada)
        run: |
          if [ -f project.zip ]; then
            unzip -o project.zip -d _extracted
            PROJECT_DIR=$(dirname "$(find _extracted -maxdepth 4 -name settings.gradle.kts | head -n 1)")
            shopt -s dotglob
            cp -r "$PROJECT_DIR"/* .
            rm -rf _extracted project.zip
          fi

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Decode keystore rilis (opsional)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "KEYSTORE_PATH=$(pwd)/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle
     uses: gradle/actions/setup-gradle@v4
     with:
       gradle-version: 8.10.2

      - name: Build Debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: UMKM-Core-${{ github.event.inputs.build_type || 'debug' }}-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
